<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f2f8"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="100%" stop-color="#ff8da1"/>
    </linearGradient>
  </defs>

  <!-- Main Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <!-- Left Ear Outer -->
    <path d="M 14 26 L 6 8 C 5 6, 8 4, 11 6 L 24 16 Z" fill="#ffffff" stroke="#2d3748" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left Ear Inner -->
    <path d="M 14 23 L 9 10 L 21 16 Z" fill="url(#earInner)"/>

    <!-- Right Ear Outer -->
    <path d="M 50 26 L 58 8 C 59 6, 56 4, 53 6 L 40 16 Z" fill="#ffffff" stroke="#2d3748" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Ear Inner -->
    <path d="M 50 23 L 55 10 L 43 16 Z" fill="url(#earInner)"/>

    <!-- Head Base -->
    <ellipse cx="32" cy="36" rx="24" ry="20" fill="url(#catBody)" stroke="#2d3748" stroke-width="2.5"/>

    <!-- Forehead Star/Sparkle Accent -->
    <path d="M 32 20 L 33 23 L 36 24 L 33 25 L 32 28 L 31 25 L 28 24 L 31 23 Z" fill="#6366f1"/>

    <!-- Eyes (Big Cute Sparkly Eyes) -->
    <!-- Left Eye -->
    <ellipse cx="22" cy="34" rx="4.5" ry="5.5" fill="#1e1b4b"/>
    <circle cx="20.5" cy="32.5" r="2" fill="#ffffff"/>
    <circle cx="23.5" cy="36" r="0.9" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="42" cy="34" rx="4.5" ry="5.5" fill="#1e1b4b"/>
    <circle cx="40.5" cy="32.5" r="2" fill="#ffffff"/>
    <circle cx="43.5" cy="36" r="0.9" fill="#ffffff"/>

    <!-- Cheeks (Blush) -->
    <ellipse cx="16" cy="39" rx="3.5" ry="2" fill="#ff9ebb" opacity="0.75"/>
    <ellipse cx="48" cy="39" rx="3.5" ry="2" fill="#ff9ebb" opacity="0.75"/>

    <!-- Nose -->
    <path d="M 30 38 Q 32 37 34 38 L 32 40 Z" fill="#ff6b8b"/>

    <!-- Mouth -->
    <path d="M 28 42 Q 32 45 32 42 Q 32 45 36 42" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <!-- Left -->
    <path d="M 8 36 L 16 37" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 7 41 L 16 40" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Right -->
    <path d="M 56 36 L 48 37" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 57 41 L 48 40" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
